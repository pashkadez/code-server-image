services:
  code-server:
    image: ghcr.io/pashkadez/code-server-vsc:latest
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PASSWORD
      - SUDO_PASSWORD
      - TZ=${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - code-server-config:/home/coder/.local/share/code-server
      - code-server-data:/home/coder/.config
      - ./project:/home/coder/project

volumes:
  code-server-config:
    driver: local
  code-server-data:
    driver: local
